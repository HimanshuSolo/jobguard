[project]
name = "jobguard"
version = "0.1.0"
description = "Personal free-to-run job-posting aggregation agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "beautifulsoup4>=4.12",
    "html2text>=2024.2",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
jobguard = "jobguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobguard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
