# Render free web service for the JobGuard dashboard.
# Attach any hosted Postgres (Neon/Supabase free tier) as DATABASE_URL;
# without it the service falls back to a local SQLite file (ephemeral).
services:
  - type: web
    name: jobguard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (or leave unset for SQLite)
      - key: OWNER_EMAIL
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SENDER_SMTP_HOST
        sync: false
      - key: SENDER_SMTP_PORT
        value: 587
      - key: SENDER_SMTP_USER
        sync: false
      - key: SENDER_SMTP_PASSWORD
        sync: false
      - key: SENDER_FROM_ADDRESS
        sync: false
