name: worker

# Stateless scheduled runs: fetch -> triage/rank -> LLM top-N -> digest.
# 01:30 UTC = 07:00 IST: sync, then email the morning digest.
# 13:30 UTC = 19:00 IST: sync + analyze only, so the morning digest has more
# AI-scored jobs. Idempotent catch-up via run_state/emails_seen/canonical
# keys: overlapping or retried runs are safe (and `concurrency` serializes).
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the morning digest after syncing"
        type: boolean
        default: true

concurrency:
  group: jobguard-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_FAST_MODEL: ${{ secrets.LLM_FAST_MODEL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      SENDER_SMTP_HOST: ${{ secrets.SENDER_SMTP_HOST }}
      SENDER_SMTP_PORT: ${{ secrets.SENDER_SMTP_PORT || '587' }}
      SENDER_SMTP_USER: ${{ secrets.SENDER_SMTP_USER }}
      SENDER_SMTP_PASSWORD: ${{ secrets.SENDER_SMTP_PASSWORD }}
      SENDER_FROM_ADDRESS: ${{ secrets.SENDER_FROM_ADDRESS }}
      DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
      BOARDS_CONFIG_PATH: data/boards.yaml
      PROFILE_PATH: data/profile.yaml
      RESUME_PATH: data/private/resume.yaml
      GMAIL_TOKEN_PATH: data/private/gmail_token.json
      LOCATION_SCOPE: india
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for name in DATABASE_URL OWNER_EMAIL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          [ -n "$SENDER_SMTP_HOST" ] || echo "::warning::SENDER_SMTP_* not set: the digest will be built but not emailed."
          [ -n "$LLM_PROVIDER" ] || echo "::warning::LLM_PROVIDER not set: jobs get quick scores only, no AI resume tailoring."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Restore private files (Gmail token, resume)
        # Written via env vars, never interpolated into the script, so JSON or
        # YAML containing quotes cannot break (or inject into) the shell.
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          RESUME_YAML: ${{ secrets.RESUME_YAML }}
        run: |
          mkdir -p data/private
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > data/private/gmail_token.json
          else
            echo "::warning::GMAIL_TOKEN_JSON not set: alert emails (LinkedIn/Naukri/...) are skipped."
          fi
          if [ -n "$RESUME_YAML" ]; then
            printf '%s' "$RESUME_YAML" > data/private/resume.yaml
          else
            echo "::warning::RESUME_YAML not set: no resume keyword/tailoring suggestions."
          fi

      - name: Sync sources + rank + analyze
        run: |
          uv run jobguard init-db
          uv run jobguard run-worker
          uv run jobguard status

      - name: Send morning digest
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 1 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.send_digest)
        run: uv run jobguard build-digest --kind morning

      - name: Send urgent (closing-soon) digest
        run: uv run jobguard build-digest --kind urgent

      - name: Remove private files
        if: always()
        run: rm -rf data/private
