{% extends "base.html" %}
{% block title %}Review approval — JobGuard{% endblock %}
{% block content %}
<h1>Review <span class="accent">approval #{{ action.id }}.</span></h1>
<p class="sub">Risk: {{ action.risk }} · expires {{ action.expires_at }}</p>
<div class="detail"><pre>{{ action.plan }}</pre></div>
<form method="post" action="/approvals/{{ token }}" style="margin-top:1rem">
<input type="hidden" name="csrf" value="{{ csrf }}">
<button class="btn" type="submit" name="decision" value="approve">Approve &amp; execute</button>
<button class="btn btn-warm" type="submit" name="decision" value="reject">Reject</button>
</form>
{% endblock %}
