{% extends "base.html" %}
{% set active = "/approvals" %}
{% block title %}Review approval · JobGuard{% endblock %}
{% block content %}
<h1>Approval #{{ action.id }}</h1>
<p class="sub">Risk: {{ action.risk }} · expires {{ action.expires_at }}</p>
<div class="panel"><pre>{{ action.plan }}</pre></div>
<form class="actions" method="post" action="/approvals/{{ token }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<button class="btn btn-primary" type="submit" name="decision" value="approve">Approve &amp; run</button>
<button class="btn" type="submit" name="decision" value="reject">Reject</button>
</form>
{% endblock %}
