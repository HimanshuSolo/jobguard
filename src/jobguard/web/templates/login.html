<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · JobGuard</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}"></head>
<body>
<div class="auth"><div class="auth-card">
<h1>JobGuard</h1>
<p class="sub">Sign in to your internship tracker.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Username<input type="text" name="username" autocomplete="username" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn btn-primary" type="submit">Sign in</button>
</form>
</div></div>
</body>
</html>
