<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JobGuard login</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="login-wrap">
<div class="brand">JOBGUARD</div>
<h1>Welcome back.</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Username<br><input name="username" autocomplete="username"></label><br>
<label>Password<br><input name="password" type="password" autocomplete="current-password"></label><br>
<button class="btn btn-warm" type="submit">Log in</button>
</form>
</div>
</body>
</html>
